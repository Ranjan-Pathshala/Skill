<section id="view-batch-leaderboard" class="app-view" style="display: none;">
      <div class="card" style="margin-bottom: 16px; padding: 16px 20px; border-top: 3px solid var(--primary);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 14px;">
          <div>
            <div style="font-size: 11.5px; font-weight: 700; color: var(--primary); margin-bottom: 2px;">Batch Performance Rankings · Rolling 30-Day Window</div>
            <h3 style="margin: 0; font-size: 18px; font-weight: 800; color: var(--secondary);">Batch Leaderboard</h3>
            <p style="margin: 3px 0 0 0; font-size: 12.5px; color: var(--text-muted);">Ranks students within their respective batches by average Net WPM and accuracy over the last 30 days.</p>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
            <select id="batch-lb-batch-select" class="form-control" style="width: auto; min-width: 180px; min-height: 36px; font-size: 12.5px; margin: 0;" onchange="if(typeof window.renderBatchLeaderboardTab==='function') window.renderBatchLeaderboardTab(false)">
              <option value="MY_BATCH">My Assigned Batch</option>
            </select>
            <select id="batch-lb-window-select" class="form-control" style="width: auto; min-width: 135px; min-height: 36px; font-size: 12.5px; margin: 0;" onchange="if(typeof window.renderBatchLeaderboardTab==='function') window.renderBatchLeaderboardTab(true)">
              <option value="30" selected>Last 30 Days</option>
              <option value="7">Last 7 Days</option>
              <option value="90">Last 90 Days</option>
            </select>
            <input type="text" id="batch-lb-search-input" class="form-control" placeholder="Search student..." style="width: 170px; min-height: 36px; font-size: 12.5px; margin: 0;" oninput="if(typeof window.renderBatchLeaderboardTab==='function') window.renderBatchLeaderboardTab(false)">
            <button type="button" class="btn btn-secondary btn-sm" style="min-height: 36px;" onclick="if(typeof window.renderBatchLeaderboardTab==='function') window.renderBatchLeaderboardTab(true)">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
          </div>
        </div>
        <div id="batch-lb-kpi-strip" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px;"></div>
      </div>

      <div id="batch-lb-podium-container" style="display: none; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px;"></div>

      <div class="card" style="padding: 16px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;">
          <h4 id="batch-lb-table-heading" style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--secondary);">Standings</h4>
          <span id="batch-lb-meta-summary" style="font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;"></span>
        </div>
        <div id="batch-lb-table-mount" style="overflow-x: auto;"></div>
      </div>
    </section>

    <!-- STUDENT MONTHLY ATTENDANCE & STREAK MATRIX (MERGED INTO #view-planner-goals) -->
